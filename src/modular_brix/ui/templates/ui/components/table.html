{% if rows %}
<table>
  <caption>{{ caption }}</caption>
  <thead>
    <tr>
      {% for header in headers %}<th scope="col">{{ header }}</th>{% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      {% for cell in row %}<td>{{ cell }}</td>{% endfor %}
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p role="status">{{ empty_message|default:"Aucun élément à afficher." }}</p>
{% endif %}
