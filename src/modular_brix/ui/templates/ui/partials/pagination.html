{# F12 partial: pagination controls for HTMX or full-page navigation. #}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}" rel="prev">Précédent</a>{% endif %}
  <span aria-current="page">Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}" rel="next">Suivant</a>{% endif %}
</nav>
