{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination"><span>Page {{ page.number }} sur {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button button-secondary" href="?q={{ query|urlencode }}&page={{ page.previous_page_number }}">Précédente</a>{% endif %}{% if page.has_next %}<a class="button button-secondary" href="?q={{ query|urlencode }}&page={{ page.next_page_number }}">Suivante</a>{% endif %}</div></nav>{% endif %}
