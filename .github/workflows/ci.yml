name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: example_project.config.settings.test
      POSTGRES_DB: app_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --no-deps -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Lint (ruff)
        run: ruff check .

      - name: Typing (mypy)
        run: mypy src

      - name: Security scan (bandit)
        run: bandit -r src -c pyproject.toml

      - name: Dependency audit (pip-audit)
        run: pip-audit --skip-editable

      - name: Migration completeness
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate from empty database
        run: python manage.py migrate --noinput

      - name: Production settings deploy check
        env:
          DJANGO_SETTINGS_MODULE: example_project.config.settings.production
          DJANGO_SECRET_KEY: ci-deploy-check-only-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Tests with coverage gate
        run: pytest -q
