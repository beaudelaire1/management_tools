[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-brix"
version = "0.1.0"
description = "Neutral modular Django foundation for management and accounting systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
  "Django>=5.2.16,<5.3",
  "psycopg[binary]>=3.2,<3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-django>=4.9,<5",
  "pytest-cov>=5,<8",
  "ruff>=0.5.0,<1",
  "mypy>=1.10,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"modular_brix.ui" = [
  "templates/ui/*.html",
  "templates/ui/components/*.html",
  "templates/ui/partials/*.html",
]
"modular_brix.portal" = [
  "templates/portal/*.html",
  "templates/portal/components/*.html",
  "templates/registration/*.html",
  "static/portal/*.css",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-p no:cacheprovider --cov=modular_brix --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["modular_brix"]
omit = ["*/migrations/*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["migrations"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
